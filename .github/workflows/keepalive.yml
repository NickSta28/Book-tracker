# Hält das kostenlose Supabase-Projekt wach (Pausierung nach 7 Tagen ohne Zugriff).
name: Supabase wach halten
on:
  schedule:
    - cron: '17 6 * * 1,4'   # montags und donnerstags, 06:17 UTC
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Datenbank anpingen
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'apikey: sb_publishable_aVklfj2TIbo0Hzhmm1-TFQ_G8rbGQd6' \
            'https://lixrcnvhfmayqhepkhwt.supabase.co/rest/v1/profiles?select=id&limit=1')
          echo "HTTP $code"
          test "$code" = "200"
