      <stop offset="0" stop-color="#8E6238"/>
      <stop offset="0.5" stop-color="#734A29"/>
      <stop offset="1" stop-color="#4E311C"/>
    </linearGradient>
    <linearGradient id="fotorahmen-mat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F1E7"/>
      <stop offset="1" stop-color="#E2D9C8"/>
    </linearGradient>
    <linearGradient id="fotorahmen-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4E4A66"/>
      <stop offset="0.35" stop-color="#8E6170"/>
      <stop offset="0.65" stop-color="#D08A5E"/>
      <stop offset="0.85" stop-color="#E5B46E"/>
    </linearGradient>
    <radialGradient id="fotorahmen-sun" cx="0.5" cy="0.5" r="0.5">
