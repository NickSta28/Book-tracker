      <stop offset="0" stop-color="#6A4A33"/>
      <stop offset="0.45" stop-color="#3E2A1C"/>
      <stop offset="1" stop-color="#22160E"/>
    </linearGradient>
    <linearGradient id="kafka-wood2" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#5E4130"/>
      <stop offset="1" stop-color="#25180F"/>
    </linearGradient>
    <radialGradient id="kafka-bg" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#A8A59E"/>
      <stop offset="0.6" stop-color="#77746E"/>
      <stop offset="1" stop-color="#45433F"/>
