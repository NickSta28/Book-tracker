    <filter id="kafka-p" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="0.28"/></filter>
    <filter id="kafka-b" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="0.8"/></filter>
    <clipPath id="kafka-pic"><ellipse cx="35" cy="150" rx="20" ry="27"/></clipPath>
